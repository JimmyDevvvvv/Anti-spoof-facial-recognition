<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .camera-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        #video {
            width: 100%;
            max-width: 640px;
            height: 480px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: #f0f0f0;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 15px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(86, 171, 47, 0.3);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1em;
        }

        .status.recognized {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
            color: white;
        }

        .status.unknown {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }

        .status.waiting {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .recognition-info {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .recognition-info.show {
            display: block;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #333;
        }

        .info-value {
            color: #666;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            #video {
                height: 300px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Ultra-Strict Face Recognition</h1>
            <p>Advanced AI-powered face recognition with anti-false-positive protection</p>
        </div>

        <div class="camera-section">
            <div class="video-container">
                <video id="video" autoplay muted></video>
                <canvas id="overlay" width="640" height="480"></canvas>
            </div>
            
            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Start Camera</button>
                <button id="recognizeBtn" class="btn btn-success" disabled>Start Recognition</button>
                <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
            </div>

            <div class="status waiting" id="status">
                Ready to start recognition
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing face recognition...</p>
            </div>

            <div class="error" id="error"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="recognitions">0</div>
                <div class="stat-label">Recognitions</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="rejections">0</div>
                <div class="stat-label">Rejections</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="accuracy">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="fps">0</div>
                <div class="stat-label">FPS</div>
            </div>
        </div>

        <div class="recognition-info" id="recognitionInfo">
            <h3>Recognition Details</h3>
            <div class="info-item">
                <span class="info-label">Name:</span>
                <span class="info-value" id="recognizedName">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Confidence:</span>
                <span class="info-value" id="confidence">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Quality Score:</span>
                <span class="info-value" id="quality">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Threshold:</span>
                <span class="info-value" id="threshold">45</span>
            </div>
        </div>
    </div>

    <script>
        class FaceRecognitionApp {
            constructor() {
                this.video = document.getElementById('video');
                this.overlay = document.getElementById('overlay');
                this.startBtn = document.getElementById('startBtn');
                this.recognizeBtn = document.getElementById('recognizeBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.status = document.getElementById('status');
                this.loading = document.getElementById('loading');
                this.error = document.getElementById('error');
                this.recognitionInfo = document.getElementById('recognitionInfo');
                
                this.stats = {
                    recognitions: document.getElementById('recognitions'),
                    rejections: document.getElementById('rejections'),
                    accuracy: document.getElementById('accuracy'),
                    fps: document.getElementById('fps')
                };
                
                this.recognitionDetails = {
                    name: document.getElementById('recognizedName'),
                    confidence: document.getElementById('confidence'),
                    quality: document.getElementById('quality'),
                    threshold: document.getElementById('threshold')
                };

                this.stream = null;
                this.isRecognizing = false;
                this.recognitionCount = 0;
                this.rejectionCount = 0;
                this.frameCount = 0;
                this.lastTime = Date.now();

                this.initEventListeners();
            }

            initEventListeners() {
                this.startBtn.addEventListener('click', () => this.startCamera());
                this.recognizeBtn.addEventListener('click', () => this.startRecognition());
                this.stopBtn.addEventListener('click', () => this.stopRecognition());
            }

            async startCamera() {
                try {
                    this.hideError();
                    this.showLoading('Starting camera...');
                    
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            frameRate: { ideal: 30 }
                        }
                    });
                    
                    this.video.srcObject = this.stream;
                    
                    this.startBtn.disabled = true;
                    this.recognizeBtn.disabled = false;
                    
                    this.hideLoading();
                    this.updateStatus('Camera started. Ready for recognition.', 'waiting');
                    
                } catch (err) {
                    this.hideLoading();
                    this.showError('Failed to access camera: ' + err.message);
                }
            }

            async startRecognition() {
                if (!this.stream) {
                    this.showError('Please start camera first');
                    return;
                }

                this.isRecognizing = true;
                this.recognizeBtn.disabled = true;
                this.stopBtn.disabled = false;
                
                this.updateStatus('Recognition active - Ultra-strict mode enabled', 'recognized');
                this.recognitionInfo.classList.add('show');
                
                // Start recognition loop
                this.recognitionLoop();
            }

            async recognitionLoop() {
                if (!this.isRecognizing) return;

                try {
                    // Capture frame from video
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = this.video.videoWidth;
                    canvas.height = this.video.videoHeight;
                    ctx.drawImage(this.video, 0, 0);

                    // Convert to base64
                    const imageData = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Send to backend API for continuous recognition
                    const results = await this.callRecognitionAPI(imageData);
                    
                    // Process all detected faces (like the original script)
                    this.processRecognitionResults(results);
                    this.updateStats();
                    
                } catch (err) {
                    console.error('Recognition error:', err);
                    this.showError('Recognition error: ' + err.message);
                }

                // Continue loop - match the original script's continuous processing
                setTimeout(() => this.recognitionLoop(), 100); // ~10 FPS like original
            }

            async callRecognitionAPI(imageData) {
                try {
                    const response = await fetch('/api/recognize', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            image: imageData
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.error) {
                        throw new Error(result.error);
                    }

                    return result;
                } catch (err) {
                    console.error('API call failed:', err);
                    throw err;
                }
            }

            async simulateRecognition() {
                // Simulate ultra-strict recognition results
                const random = Math.random();
                
                if (random < 0.3) {
                    // 30% chance of recognition
                    const names = ['OMAR', 'DINA', 'Person 1', 'Person 2', 'Person 3'];
                    const name = names[Math.floor(Math.random() * names.length)];
                    const confidence = 25 + Math.random() * 15; // 25-40
                    const quality = 0.7 + Math.random() * 0.2; // 0.7-0.9
                    
                    return {
                        recognized: true,
                        name: name,
                        confidence: confidence.toFixed(1),
                        quality: quality.toFixed(2),
                        threshold: 45
                    };
                } else {
                    // 70% chance of rejection
                    const confidence = 45 + Math.random() * 80; // 45-125
                    const quality = 0.3 + Math.random() * 0.4; // 0.3-0.7
                    
                    return {
                        recognized: false,
                        name: 'Unknown',
                        confidence: confidence.toFixed(1),
                        quality: quality.toFixed(2),
                        threshold: 45
                    };
                }
            }

            processRecognitionResults(results) {
                // Clear previous overlay
                this.clearOverlay();
                
                // Process all detected faces like the original ultra_strict_recognition.py
                if (results.faces && results.faces.length > 0) {
                    let hasRecognized = false;
                    let statusMessage = '';
                    
                    results.faces.forEach((faceResult, index) => {
                        // Draw face rectangle on overlay
                        this.drawFaceRectangle(faceResult);
                        
                        // Update recognition result
                        this.updateRecognitionResult(faceResult, index);
                        
                        // Build status message
                        if (faceResult.recognized) {
                            hasRecognized = true;
                            statusMessage += `✅ ${faceResult.name} `;
                        }
                    });
                    
                    // Update status with all faces
                    if (hasRecognized) {
                        this.updateStatus(statusMessage.trim(), 'recognized');
                    } else {
                        this.updateStatus(`❌ ${results.faces.length} face(s) rejected`, 'unknown');
                    }
                    
                } else if (results.recognized !== undefined) {
                    // Single face result (backward compatibility)
                    this.updateRecognitionResult(results, 0);
                } else {
                    // No faces detected
                    this.updateStatus('No faces detected', 'waiting');
                }
            }

            clearOverlay() {
                const ctx = this.overlay.getContext('2d');
                ctx.clearRect(0, 0, this.overlay.width, this.overlay.height);
            }

            drawFaceRectangle(faceResult) {
                const ctx = this.overlay.getContext('2d');
                const coords = faceResult.coordinates;
                
                // Scale coordinates to match video display
                const scaleX = this.video.clientWidth / this.video.videoWidth;
                const scaleY = this.video.clientHeight / this.video.videoHeight;
                
                const x = coords.x * scaleX;
                const y = coords.y * scaleY;
                const w = coords.w * scaleX;
                const h = coords.h * scaleY;
                
                // Choose color based on recognition result
                const color = faceResult.recognized ? '#00ff00' : '#ff0000';
                
                // Draw rectangle
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);
                
                // Draw label background
                const labelText = faceResult.recognized ? 
                    `${faceResult.name} ✅` : 
                    'Unknown ❌';
                
                ctx.fillStyle = color;
                ctx.font = 'bold 16px Arial';
                const textWidth = ctx.measureText(labelText).width;
                ctx.fillRect(x, y - 25, textWidth + 10, 25);
                
                // Draw label text
                ctx.fillStyle = 'white';
                ctx.fillText(labelText, x + 5, y - 8);
                
                // Draw confidence info
                const confText = `Conf: ${faceResult.confidence.toFixed(1)}`;
                ctx.fillStyle = color;
                ctx.font = '12px Arial';
                const confWidth = ctx.measureText(confText).width;
                ctx.fillRect(x, y + h + 5, confWidth + 8, 18);
                
                ctx.fillStyle = 'white';
                ctx.fillText(confText, x + 4, y + h + 17);
            }

            updateRecognitionResult(result, faceIndex = 0) {
                if (result.recognized) {
                    this.recognitionCount++;
                } else {
                    this.rejectionCount++;
                }

                // Update recognition details with the first face (or most recent)
                if (faceIndex === 0) {
                    this.recognitionDetails.name.textContent = result.name;
                    this.recognitionDetails.confidence.textContent = result.confidence;
                    this.recognitionDetails.quality.textContent = result.quality;
                    this.recognitionDetails.threshold.textContent = result.threshold;
                }
            }

            updateStats() {
                this.frameCount++;
                const now = Date.now();
                const elapsed = (now - this.lastTime) / 1000;
                
                if (elapsed >= 1) {
                    const fps = this.frameCount / elapsed;
                    this.stats.fps.textContent = Math.round(fps);
                    
                    this.frameCount = 0;
                    this.lastTime = now;
                }

                this.stats.recognitions.textContent = this.recognitionCount;
                this.stats.rejections.textContent = this.rejectionCount;
                
                const total = this.recognitionCount + this.rejectionCount;
                if (total > 0) {
                    const accuracy = (this.recognitionCount / total) * 100;
                    this.stats.accuracy.textContent = Math.round(accuracy) + '%';
                }
            }

            stopRecognition() {
                this.isRecognizing = false;
                this.recognizeBtn.disabled = false;
                this.stopBtn.disabled = true;
                
                this.updateStatus('Recognition stopped', 'waiting');
                this.recognitionInfo.classList.remove('show');
                this.clearOverlay(); // Clear face rectangles
            }

            updateStatus(message, type) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
            }

            showLoading(message) {
                this.loading.querySelector('p').textContent = message;
                this.loading.classList.add('show');
            }

            hideLoading() {
                this.loading.classList.remove('show');
            }

            showError(message) {
                this.error.textContent = message;
                this.error.classList.add('show');
            }

            hideError() {
                this.error.classList.remove('show');
            }
        }

        // Initialize app when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new FaceRecognitionApp();
        });
    </script>
</body>
</html>
